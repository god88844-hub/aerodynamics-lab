name: Release Desktop Build

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build-windows-app:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build Standalone Native C++20/OpenGL AerodynamicsLab.exe (Zero Game Engine)
        shell: pwsh
        run: |
          cmake -S apps/native -B apps/native/build -DCMAKE_BUILD_TYPE=Release
          cmake --build apps/native/build --config Release --parallel 4
          ctest --test-dir apps/native/build -C Release --output-on-failure
          New-Item -ItemType Directory -Force .local\release | Out-Null
          $nativeExe = Get-ChildItem -Path apps\native\build -Filter AerodynamicsLab.exe -Recurse | Select-Object -First 1
          if (-not $nativeExe) { throw "AerodynamicsLab.exe not found" }
          Copy-Item -Force $nativeExe.FullName .local\release\AerodynamicsLab.exe
          Copy-Item -Force $nativeExe.FullName apps\native\build\AerodynamicsLab.exe -ErrorAction SilentlyContinue
          python scripts/package_windows_app.py dist\AerodynamicsLab-Stage --zip dist\AerodynamicsLab-Windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: AerodynamicsLab-Windows-Standalone
          path: |
            .local/release/AerodynamicsLab.exe
            dist/AerodynamicsLab-Windows-x64.zip
