name: Dependency security triage

on:
  push:
    branches:
      - feature/m11-security-dependency-audit

permissions:
  contents: read

jobs:
  npm-advisory-triage:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install exact locked dependencies without package scripts
        run: npm ci --ignore-scripts
      - name: Print actionable npm advisories with dependency paths
        run: |
          npm audit --json > /tmp/aeroforge-npm-audit.json || true
          node --input-type=commonjs <<'NODE'
          const fs = require('node:fs');
          const data = JSON.parse(fs.readFileSync('/tmp/aeroforge-npm-audit.json', 'utf8'));
          if (data.error) { console.error(data.error); process.exit(1); }
          const rows = Object.entries(data.vulnerabilities ?? {}).map(([name, v]) => ({
            package: name, severity: v.severity, isDirect: v.isDirect, range: v.range,
            via: (v.via ?? []).map(x => typeof x === 'string' ? x : ({
              title: x.title, url: x.url, range: x.range, source: x.source
            })),
            effects: v.effects, fixAvailable: v.fixAvailable,
            nodes: v.nodes,
          }));
          console.log('AUDIT_COUNTS', JSON.stringify(data.metadata?.vulnerabilities ?? {}));
          console.log('AUDIT_DETAILS', JSON.stringify(rows, null, 2));
          NODE
      - name: Print non-forcing remediation possibilities
        run: |
          npm audit fix --package-lock-only --ignore-scripts --dry-run --json > /tmp/aeroforge-fix-plan.json || true
          node --input-type=commonjs <<'NODE'
          const fs = require('node:fs');
          const data = JSON.parse(fs.readFileSync('/tmp/aeroforge-fix-plan.json', 'utf8'));
          console.log('DRY_RUN_COUNTS', JSON.stringify(data.metadata?.vulnerabilities ?? {}));
          console.log('DRY_RUN_PACKAGES', JSON.stringify({
            added: data.added, removed: data.removed, changed: data.changed,
            error: data.error,
          }));
          NODE
