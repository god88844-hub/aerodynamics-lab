name: CI

on:
  push:
  pull_request:

# Limit token permissions to source checkout only.
permissions:
  contents: read

# Per-head concurrency keeps the most recent verification rather than
# exhausting runners on stale commits and duplicate push/PR runs.
# Main gets its own group; fork heads cannot cancel another repository.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  desktop-foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install locked CAD worker dependencies
        run: |
          pip install --require-hashes --only-binary=:all: -r apps/desktop/requirements-cad.lock
          pip check
      - name: Audit locked CAD worker dependencies
        run: |
          python -m venv "$RUNNER_TEMP/lab-cad-audit"
          "$RUNNER_TEMP/lab-cad-audit/bin/pip" install pip-audit==2.10.1
          "$RUNNER_TEMP/lab-cad-audit/bin/python" -m pip_audit -r apps/desktop/requirements-cad.lock --disable-pip --no-deps
      - name: Verify CAD geometry and portable assets
        run: |
          python -c "import cadquery"
          pytest tests/cad tests/integration/test_project_assets.py
      - name: Download pinned Godot
        run: |
          curl --fail --location --output godot.zip https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          echo "cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4  godot.zip" | sha256sum --check
          unzip -q godot.zip -d /tmp/aerodynamics-godot
          rm godot.zip
      - name: Build native engineering core
        run: |
          cmake -S packages/engineering-core -B packages/engineering-core/build -DCMAKE_BUILD_TYPE=Release -DLAB_BUILD_GDEXTENSION=ON
          cmake --build packages/engineering-core/build --parallel 2
      - name: Run native and desktop integration checks
        env:
          LAB_PYTHON: python
          LAB_CAD_PYTHON: python
          LAB_TEST_CAD: "1"
        run: |
          ctest --test-dir packages/engineering-core/build --output-on-failure
          xvfb-run -a /tmp/aerodynamics-godot/Godot_v4.7.2-stable_linux.x86_64 --rendering-method gl_compatibility --path apps/desktop --editor --import --quit
          /tmp/aerodynamics-godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path apps/desktop --script smoke_test.gd

  python-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install backend dependencies
        run: |
          pip install --require-hashes --only-binary=:all: -r apps/api/requirements.lock
          pip check
      - name: Audit locked backend dependencies
        run: |
          python -m venv "$RUNNER_TEMP/aeroforge-audit"
          "$RUNNER_TEMP/aeroforge-audit/bin/pip" install pip-audit==2.10.1
          "$RUNNER_TEMP/aeroforge-audit/bin/python" -m pip_audit -r apps/api/requirements.lock --disable-pip --no-deps
      - name: Run pytest (physics, integration, regression)
        run: pytest

  web-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Audit all frontend dependencies (including development tools)
        run: npm audit --audit-level=moderate
      - name: Typecheck + build
        run: npm run build
      - name: Unit tests
        run: npm test

  packaged-app:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install browser test dependencies
        working-directory: apps/web
        run: |
          npm ci
          npx --no-install playwright install --with-deps --only-shell chromium
      - name: Start packaged app
        run: docker compose --project-name aeroforge-e2e up --build --wait --wait-timeout 90
      - name: Verify browser, proxy, solver, and stored data
        working-directory: apps/web
        run: npm run test:e2e
      - name: Verify authenticated HTTPS deployment
        run: |
          if ! command -v htpasswd >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y apache2-utils
          fi
          bash scripts/check_authenticated_compose.sh
      - name: Print container logs on failure
        if: failure()
        run: docker compose --project-name aeroforge-e2e logs --no-color
      - name: Clean up the test stack
        if: always()
        run: docker compose --project-name aeroforge-e2e down --volumes
