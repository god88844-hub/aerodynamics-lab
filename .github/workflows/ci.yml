name: CI

on:
  push:
  pull_request:

# Limit token permissions to source checkout only.
permissions:
  contents: read

# Per-head concurrency keeps the most recent verification rather than
# exhausting runners on stale commits and duplicate push/PR runs.
# Main gets its own group; fork heads cannot cancel another repository.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  python-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install backend dependencies
        run: pip install -r apps/api/requirements.txt
      - name: Run pytest (physics, integration, regression)
        run: pytest

  web-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Audit all frontend dependencies (including development tools)
        run: npm audit --audit-level=moderate
      - name: Typecheck + build
        run: npm run build
      - name: Unit tests
        run: npm test
