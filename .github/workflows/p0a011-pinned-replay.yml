name: P0A-011 pinned M25 replay (temporary diagnostic)
on:
  push:
    branches:
      - feature/p0a-011-canonical-m25-detector
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verified-publisher-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install locked backend dependencies
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r apps/api/requirements.lock
          python -m pip check
      - name: Acquire eight pinned Zenodo originals OUTSIDE Git
        run: |
          python scripts/p0a011_download_verified.py --directory "$RUNNER_TEMP/p0a011-uavfd"
      - name: Evaluate canonical detector and test candidate artifact
        run: |
          PYTHONPATH=packages:scripts:. python - <<'PY'
          import json
          import os
          import subprocess
          import sys
          from pathlib import Path
          sys.path[:0] = ["packages", "scripts"]
          from benchmark_p0a_011_uav_fd import reproduce
          source_dir = Path(os.environ["RUNNER_TEMP"]) / "p0a011-uavfd"
          live = reproduce(source_dir)
          target = Path("docs/campaigns/m25_p0a_011_detector_delta.json")
          wrapper = json.loads(target.read_text(encoding="utf-8"))
          if wrapper.get("after_status") not in (
              "NOT_REEXECUTED_RAW_MAT_UNAVAILABLE",
              "REPRODUCED_FROM_PINNED_PUBLISHER_BYTES",
          ):
              raise ValueError("Unrecognized prior delta state")
          if wrapper["before"] != {
              name: flight["before"] for name, flight in live["holdouts"].items()
          }:
              raise AssertionError("Frozen before decisions drifted")
          wrapper["after_status"] = "REPRODUCED_FROM_PINNED_PUBLISHER_BYTES"
          wrapper["after"] = live["holdouts"]
          wrapper["calibration"] = live["calibration"]
          wrapper["calibration_canonical_sha256"] = live["calibration_canonical_sha256"]
          wrapper["live_result"] = live
          wrapper["limitation"] = (
              "DEVELOPMENT retrospective on one rig; shared-IMU motor-frequency "
              "attribution is not physical isolation; no fault-onset timestamp "
              "permits measured detection-deadline compliance."
          )
          result_text = json.dumps(wrapper, sort_keys=True, indent=2, allow_nan=False) + "\n"
          output = Path("/tmp/p0a011_delta_verified.json")
          output.write_text(result_text, encoding="utf-8")
          target.write_text(result_text, encoding="utf-8")
          env = dict(os.environ)
          env.pop("AEROFORGE_UAV_FD_DIR", None)
          subprocess.run([sys.executable, "-m", "pytest",
                          "tests/acceptance/test_p0a_010.py",
                          "tests/acceptance/test_p0a_011.py", "-q"],
                         check=True, env=env)
          env["AEROFORGE_UAV_FD_DIR"] = str(source_dir)
          subprocess.run([sys.executable, "-m", "pytest",
                          "tests/acceptance/test_p0a_010.py",
                          "tests/acceptance/test_p0a_011.py", "-q"],
                         check=True, env=env)
          print("P0A011_DELTA_JSON=" +
                json.dumps(wrapper, sort_keys=True, separators=(",", ":"), allow_nan=False),
                flush=True)
          print("P0A011_REAL_DATA_REPRODUCTION_COMPLETE", flush=True)
          PY
      - name: Attach only comparison JSON, never MAT archives
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: p0a011-verified-development-delta
          path: /tmp/p0a011_delta_verified.json
          if-no-files-found: error
          retention-days: 7
