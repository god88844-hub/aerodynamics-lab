upstream aeroforge_api {
  zone aeroforge_api 64k;
  resolver 127.0.0.11 valid=5s ipv6=off;
  server api:8000 resolve;
}

server {
  # Preserve the Compose health probe on a container-local listener.
  listen 127.0.0.1:80;

  location = /api/health {
    proxy_pass http://aeroforge_api;
  }

  location / {
    return 404;
  }
}

server {
  listen 443 ssl;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_certificate /run/secrets/aeroforge_tls_certificate;
  ssl_certificate_key /run/secrets/aeroforge_tls_key;

  auth_basic "AeroForge";
  auth_basic_user_file /run/secrets/aeroforge_htpasswd;

  location /api/ {
    proxy_pass http://aeroforge_api;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Authorization "";
  }

  location / {
    root /usr/share/nginx/html;
    try_files $uri /index.html;
  }
}
