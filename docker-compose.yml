services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports:
      - "${AEROFORGE_BIND_ADDRESS:-127.0.0.1}:8000:8000"
    environment:
      AEROFORGE_DB_URL: sqlite:////srv/aeroforge/state/aeroforge.db
    volumes:
      - appdata:/srv/aeroforge/state
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/api/health', timeout=2).close()"]
      interval: 2s
      timeout: 3s
      retries: 20

  db:
    image: postgres:16-alpine
    profiles: ["postgres"]
    environment:
      POSTGRES_USER: aeroforge
      POSTGRES_PASSWORD: aeroforge
      POSTGRES_DB: aeroforge
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "${AEROFORGE_BIND_ADDRESS:-127.0.0.1}:5173:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/api/health"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  appdata:
  pgdata:
